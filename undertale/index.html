<!DOCTYPE html>
<!-- Ultimate Game Stash file converted -->
<html>
<head>
  <base href="https://cdn.jsdelivr.net/gh/gn-math/assets@main/184/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>UNDERTALE</title>
  <style>
    body { color: #ffffff; font-family: sans-serif; overflow: hidden; margin: 0; padding: 0; background-color: #000000; }
    #app, #loading, #error, #launch { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .progress-bar-outer { border: 1px solid currentColor; height: 10px; width: 200px; }
    .progress-bar-inner { height: 100%; width: 0; background-color: currentColor; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading" class="screen">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>
  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details><summary id="error-message"></summary><p id="error-stack"></p></details>
  </div>
  <script src="script.js"></script>
  <script>
    const appElement = document.getElementById('app');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');
    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      errorScreenStack.textContent = (error && error.stack || 'no stack') + '\nUser agent: ' + navigator.userAgent;
    };
    const setProgress = (progress) => { if (loadingInner) loadingInner.style.width = progress * 100 + '%'; };
    const interpolate = (a, b, t) => a + t * (b - a);
    try {
      setProgress(0.1);
      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 480;
      scaffolding.height = 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);
      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      scaffolding.setUsername("player" + Math.floor(Math.random()*10000));
      scaffolding.setAccentColor("#ff4c4c");
      try {
        scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(["wss://clouddata.turbowarp.org","wss://clouddata.turbowarp.xyz"], "791527350"));
      } catch (error) { console.error(error); }
      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(30);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({ fencing: true, miscLimits: true, maxClones: 300 });
      if (vm.setCompilerOptions) vm.setCompilerOptions({ enabled: true, warpTimer: false });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);
      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
    } catch (e) { handleError(e); }
    const getProjectData = (function() {
      const storage = scaffolding.storage;
      storage.onprogress = (total, loaded) => { setProgress(interpolate(0.2, 0.98, loaded / total)); };
      storage.addWebStore(
        [storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound, storage.AssetType.Font].filter(i => i),
        (asset) => new URL('https://cdn.jsdelivr.net/gh/gn-math/assets@main/184/assets/' + asset.assetId + '.' + asset.dataFormat, location).href
      );
      return () => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => resolve(xhr.response);
        xhr.onerror = () => reject(new Error('Request to load project data failed.'));
        xhr.onprogress = (e) => { if (e.lengthComputable) setProgress(interpolate(0.1, 0.2, e.loaded / e.total)); };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "./assets/project.json");
        xhr.send();
      });
    })();
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      scaffolding.start();
    };
    run().catch(handleError);
  </script>
</body>
</html>
