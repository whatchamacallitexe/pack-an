<!DOCTYPE html>
<html lang="en-us">
<head>
  <script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/web-port@master/ultrakill/">
  <meta charset="utf-8">
  <title>ULTRAKILL</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
    #unity-container { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
  </style>
</head>
<body>
  <div id="loading-text" style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
  <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
  <script src="Build/ultrakill.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    async function mergeFilesSequential(fileParts) {
      let buffers = [];
      for (let i = 0; i < fileParts.length; i++) {
        const response = await fetch(fileParts[i]);
        if (!response.ok) throw new Error('Failed ' + fileParts[i]);
        buffers.push(await response.arrayBuffer());
      }
      return URL.createObjectURL(new Blob(buffers));
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }

    (async function() {
      try {
        const dataUrl = await mergeFilesSequential(getParts("Build/ultrakill.data.unityweb", 1, 4));
        const wasmurl = await mergeFilesSequential(getParts("Build/ultrakill.wasm.unityweb", 1, 2));
        document.querySelector("#unity-canvas").hidden = false;
        await createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: dataUrl,
          frameworkUrl: "Build/ultrakill.framework.js.unityweb",
          codeUrl: wasmurl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Hakita and Cake Logic",
          productName: "ULTRAKILL",
          productVersion: "1.4"
        });
        document.querySelector("#loading-text").remove();
      } catch (e) {
        document.querySelector("#loading-text").textContent = "Failed: " + e.message;
      }
    })();
  </script>
</body>
</html>
